name: debug-token
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: token 元信息（脱敏）
        env:
          WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, json, base64
          t = os.environ.get("WB_ACCESS_TOKEN", "")
          print("长度:", len(t))
          print("前缀6位:", t[:6], "后缀4位:", t[-4:])
          print("字符集安全:", all(c.isalnum() or c in "-_." for c in t))
          parts = t.split(".")
          print("JWT段数:", len(parts))
          if len(parts) == 3:
              seg = parts[1]; seg += "=" * (-len(seg) % 4)
              p = json.loads(base64.urlsafe_b64decode(seg))
              print("iat:", p.get("iat"), "exp:", p.get("exp"))
          PYEOF
      - name: runner 直连续口
        env:
          WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, ssl, urllib.request, urllib.error
          t = os.environ.get("WB_ACCESS_TOKEN", "")
          h = {"Accept":"application/json","Authorization":"Bearer "+t,"Content-Type":"application/json","User-Agent":"WorkBuddy"}
          req = urllib.request.Request("https://copilot.tencent.com/v2/billing/meter/checkin-activity-status", data=None, headers=h, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=20, context=ssl.create_default_context()) as r:
                  print("HTTP", r.status); print(r.read().decode()[:300])
          except urllib.error.HTTPError as e:
              print("HTTPError", e.code); print("server:", e.headers.get("Server")); print(e.read().decode()[:300])
          except Exception as e:
              print("EXC", type(e).__name__, e)
          PYEOF
      - name: runner 出口 IP
        run: |
          echo -n "ip: "; curl -s --max-time 10 https://api.ipify.org; echo
          curl -s --max-time 10 "http://ip-api.com/json/?fields=country,regionName,city,isp,query" | head -c 400; echo
